name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. Flutter 3.38
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      # ==========================================
      # 4. Flutter 环境
      # ==========================================
      - name: Flutter Doctor
        run: flutter doctor -v

      # ==========================================
      # 5. 恢复 Android Keystore
      # ==========================================
      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"

      # ==========================================
      # 6. 创建 key.properties
      # ==========================================
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > simple_live_app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/release.jks
          EOF

      # ==========================================
      # 7. 获取 Flutter 依赖
      # ==========================================
      - name: Flutter Pub Get
        working-directory: simple_live_app
        run: flutter pub get

      # ==========================================
      # 8. 检查关键依赖
      # ==========================================
      - name: Check Dependencies
        working-directory: simple_live_app
        run: |
          echo "======================================"
          echo "auto_orientation"
          echo "======================================"
          flutter pub deps --style=compact | grep -i auto_orientation || true

          echo "======================================"
          echo "dynamic_color"
          echo "======================================"
          flutter pub deps --style=compact | grep -i dynamic_color || true

      # ==========================================
      # 9. 编译 Android APK
      # ==========================================
      - name: Build APK
        working-directory: simple_live_app
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      # ==========================================
      # 10. 检查 APK
      # ==========================================
      - name: List APK
        run: |
          echo "======================================"
          echo "Generated APK"
          echo "======================================"

          ls -lh \
            simple_live_app/build/app/outputs/flutter-apk/

      # ==========================================
      # 11. 上传 APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
