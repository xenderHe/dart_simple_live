name: Build Simple Live

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:

  # =========================
  # Android
  # =========================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build APK
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk


  # =========================
  # Windows
  # =========================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter Pub Get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Windows
        working-directory: simple_live_app
        run: flutter build windows --release

      - name: Compress Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path simple_live_app/build/windows/x64/runner/Release/* `
            -DestinationPath simple_live_app-windows-x64.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: simple_live_app-windows-x64.zip


  # =========================
  # Linux
  # =========================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libasound2-dev \
            libmpv-dev \
            mpv

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter Pub Get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Linux
        working-directory: simple_live_app
        run: flutter build linux --release

      - name: Compress Linux
        run: |
          cd simple_live_app/build/linux/x64/release/bundle
          zip -r ../../../../../../simple_live_app-linux-x64.zip .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: simple_live_app-linux-x64.zip
